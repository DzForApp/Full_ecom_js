version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ecom_postgres
    restart: always
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: Store25
      POSTGRES_DB: dbstore
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
volumes:
  pgdata: