### docker-compose.yml (extrait)
#yaml
version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shoppass
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
  minio:
    image: minio/minio
    command: server /data
  backend:
    build: ./apps/backend-nestjs
    depends_on: [db, redis, minio]
    ports: ['4000:4000']
  frontend:
    build: ./apps/frontend-nextjs
    ports: ['3000:3000']
volumes:
  db_data:

