### docker-compose.yml (extrait)
#yaml
#version: '3.8'
services:
  db:
    image: postgres:15
    container_name: store-db
    environment:
      POSTGRES_DB: dbstore
      POSTGRES_USER: store
      POSTGRES_PASSWORD: Store25
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
  minio:
    image: minio/minio
    command: server /data
  backend:
    build: ./apps/backend
    depends_on: [db, redis, minio]
    ports: ['4000:4000']
  frontend:
    build: ./apps/frontend
    ports: ['3000:3000']
volumes:
  db_data:

